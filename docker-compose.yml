services:
  pankeeper:
    image: ghcr.io/xinyulo/pankeeper:latest
    # 源码构建：注释掉上面 image，改用下面 build 段（需完整仓库）
    # build:
    #   context: ./pankeeper-backend
    #   additional_contexts:
