# 构建并推送 PanKeeper 全家桶镜像到 GHCR + Docker Hub。
# 双机原生矩阵：amd64 跑 ubuntu-latest，arm64 跑 GitHub 免费 arm runner（无 QEMU，分钟级），
# 各自推带平台后缀的标签，最后 merge job 合成多架构清单。
# 触发：push 到 main（latest + sha 短标签）、打 v* 标签（语义化版本标签）、手动
name: Build & Push Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: amd64
          - os: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/pankeeper
          flavor: |
            suffix=-${{ matrix.suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./pankeeper-backend
          build-contexts: |
            frontend=./pankeeper-vue3
          platforms: ${{ matrix.suffix == 'amd64' && 'linux/amd64' || 'linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

  merge:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/pankeeper
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Merge multi-arch manifest lists
        run: |
          set -euo pipefail
          while read -r tag; do
            [ -z "$tag" ] && continue
            repo="${tag%:*}"
            part="${tag##*:}"
            echo "merging -> $tag"
            docker buildx imagetools create -t "$tag" \
              "$repo:${part}-amd64" \
              "$repo:${part}-arm64"
          done <<< "${{ steps.meta.outputs.tags }}"
