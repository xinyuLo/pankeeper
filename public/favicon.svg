<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><defs>
    <!-- 大容器渐变：亮蓝 → 主蓝 -->
    <linearGradient id="pkBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4096ff"/>
      <stop offset="1" stop-color="#1677ff"/>
    </linearGradient>
    <!-- 小容器渐变：主蓝 → 深蓝，与容器拉开层次 -->
    <linearGradient id="pkCap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1677ff"/>
      <stop offset="1" stop-color="#0958d9"/>
    </linearGradient>
    <clipPath id="pkClipBody">
      <rect x="1.6" y="3.2" width="14.2" height="17.6" rx="4.6"/>
    </clipPath>
  </defs><!-- 大容器（P 的竖干 + 容器本体） -->
  <rect x="1.6" y="3.2" width="14.2" height="17.6" rx="4.6" fill="url(#pkBody)"/>
  <!-- 容器内的「盘位」刻线，暗示这是收纳容器而非普通方块 -->
  <g clip-path="url(#pkClipBody)" opacity=".44">
    <rect x="1.6" y="12.1" width="14.2" height="1.5" fill="#fff"/>
    <rect x="1.6" y="16.1" width="14.2" height="1.5" fill="#fff"/>
  </g>

  <!-- 汇聚点：三枚圆点 + 连接线，斜向汇入容器右下角 -->
  <g>
    <path d="M20.1 6.1L16.4 9.5" stroke="#1677ff" stroke-width="1.25" stroke-linecap="round" opacity=".62"/>
    <path d="M20.4 11.6L16.5 12.9" stroke="#13c2c2" stroke-width="1.25" stroke-linecap="round" opacity=".62"/>
    <path d="M20.1 17.1L16.6 16.2" stroke="#722ed1" stroke-width="1.25" stroke-linecap="round" opacity=".62"/>
    <circle cx="20.9" cy="5.5" r="1.75" fill="#1677ff"/>
    <circle cx="21.4" cy="12.0" r="1.75" fill="#13c2c2"/>
    <circle cx="20.9" cy="18.5" r="1.75" fill="#722ed1"/>
  </g>

  <!-- 覆层的 P 碗 + 与主竖干相交出的 K 横臂（同色，读作一个整体） -->
  <g fill="url(#pkCap)">
    <rect x="8.1" y="6.0" width="7.2" height="8.3" rx="3.3"/>
    <rect x="9.4" y="8.9" width="7.3" height="2.5" rx="1.25"/>
  </g></svg>