<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- PanKeeper 图标：靛蓝玻璃皮 + P 字标（B2+G1 定稿，2026-09-28）
       favicon 用自带圆角（rx=115 ≈ 苹果 squircle 比例）+ 透明四角；
       主屏 PNG 由 rasterize 页栅格化：apple-touch/maskable 用满幅版，any 用圆角版 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cf6"/>
      <stop offset=".5" stop-color="#3b6ef6"/>
      <stop offset="1" stop-color="#1d3ad8"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".2" cy=".1" r="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".4"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".2"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e4ff"/>
    </linearGradient>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6ef6"/>
      <stop offset="1" stop-color="#7c5cf6"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0a146e" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="512" rx="115" fill="url(#sheen)"/>
  <rect x="118" y="120" width="276" height="278" rx="78" fill="url(#tile)" filter="url(#soft)"/>
  <path d="M196 334 L196 184 L252 184 A56 56 0 0 1 252 296 L196 296"
        fill="none" stroke="url(#pg)" stroke-width="54"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
